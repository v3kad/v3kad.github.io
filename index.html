<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #700000 0%, #200000 50%, #000000 100%);
            font-family: 'Roboto', sans-serif;
            color: white;
            user-select: none; 
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(255, 100, 100, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 100, 100, 0.3) 1px, transparent 1px);
            background-size: 80px 80px;
            animation: moveGrid 4s linear infinite;
            pointer-events: none;
        }

        @keyframes moveGrid {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 80px -80px;
            }
        }

        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .title-main {
            font-size: 7rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
        }

        .title-sub {
            font-size: 2rem;
            font-weight: 900;
            color: #ff4444;
            margin-top: -5px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 0, 0, 1);
            background: rgba(0,0,0,0.4);
            padding: 5px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,0,0,0.3);
        }

        .map-name {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 50px;
            text-shadow: 2px 2px 10px black;
        }

        .logs-container {
            width: 80%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 160px;
            overflow: hidden;
            position: relative;
        }

        .log-item {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            margin-bottom: 8px;
            text-shadow: 1px 1px 4px black;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .log-item:nth-child(1) {
            font-size: 1.6rem;
            color: #ffffff;
            transform: translateY(0) scale(1.05);
            opacity: 1;
            text-shadow: 0 0 15px rgba(255, 50, 50, 0.8);
        }

        .log-item:nth-child(2) {
            font-size: 1.2rem;
            color: #cccccc;
            transform: translateY(5px) scale(1);
            opacity: 0.7;
        }

        .log-item:nth-child(3) {
            font-size: 1rem;
            color: #999999;
            transform: translateY(10px) scale(0.95);
            opacity: 0.4;
        }

        .log-item:nth-child(n+4) {
            font-size: 0.8rem;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            height: 0;
            margin: 0;
        }

    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="content-wrapper">
        <div class="title-main">Z-TYLE</div>
        <div class="title-sub">Сервер нормальный, обещаю))</div>
        
        <div class="map-name" id="map-display">Загрузка...</div>

        <div class="logs-container" id="logs"></div>
    </div>

    <script>
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('map-display').innerText = mapname;
        }
        function DownloadingFile(fileName) { addLog("Downloading " + fileName); }
        function SetStatusChanged(status) { addLog(status); }

        function addLog(text) {
            const container = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerText = text;
            container.prepend(div);
            if (container.children.length > 5) container.removeChild(container.lastChild);
        }

        if (!navigator.userAgent.includes("Valve Source Client")) {
            document.getElementById('map-display').innerText = "gm_construct";
            let i = 0;
            setInterval(() => {
                addLog("Загрузка файла: materials/models/props/test_file_" + i + ".vtf");
                i++;
            }, 600);
        }
    </script>
</body>
</html>
