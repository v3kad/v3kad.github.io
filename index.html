<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Roboto', sans-serif;
            color: white;
            user-select: none; 
        }

        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: grayscale(100%) brightness(0.4); 
        }

        .bg-slide.active {
            opacity: 1;
        }

        .vignette-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.8) 60%, #000000 100%);
            pointer-events: none;
        }

        .grid-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 300vw;
            height: 300vw;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.7) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.7) 2px, transparent 2px);
            background-size: 100px 100px;
            transform-origin: center;
            animation: rotateGrid 80s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGrid {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .title-main {
            font-size: 7rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-shadow: 4px 4px 0px #000, 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .title-sub {
            font-size: 2rem;
            font-weight: 900;
            color: #ff3333;
            margin-top: -5px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 5px;
        }

        .map-name {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 2px 2px 5px #000;
        }

        .logs-container {
            width: 80%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 150px;
            overflow: hidden;
        }

        .log-item {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px #000;
        }

        .log-item:nth-child(1) {
            font-size: 1.5rem;
            color: #ffffff;
            transform: scale(1.05);
            font-weight: 900;
        }
        .log-item:nth-child(2) { font-size: 1.2rem; color: #dddddd; opacity: 0.8; }
        .log-item:nth-child(3) { font-size: 1rem; color: #bbbbbb; opacity: 0.5; }
        .log-item:nth-child(n+4) { opacity: 0; height: 0; }

    </style>
</head>
<body>

    <div id="bg-container"></div>
    <div class="vignette-layer"></div>
    <div class="grid-bg"></div>

    <div class="content-wrapper">
        <div class="title-main">Z-TYLE</div>
        <div class="title-sub">Fun & NoRules.</div>
        
        <div class="map-name" id="map-display">Загрузка...</div>

        <div class="logs-container" id="logs"></div>
    </div>

    <script>
        const backgroundImages = [
            'https://cdn.discordapp.com/attachments/1434555097446223963/1468977267458707646/142120.jpg?ex=6985fb30&is=6984a9b0&hm=5f15eb839106787aa8ffc49d89cf0a4b6ce0cdd62d7ce5fb23eaf0da7de41c36&'
        ];
        const slideTime = 3000;

        const bgContainer = document.getElementById('bg-container');
        let currentSlideIndex = 0;

        backgroundImages.forEach((url, index) => {
            const div = document.createElement('div');
            div.className = 'bg-slide';
            div.style.backgroundImage = `url('${url}')`;
            if(index === 0) div.classList.add('active');
            bgContainer.insertBefore(div, bgContainer.firstChild);
        });

        const slides = document.querySelectorAll('.bg-slide');

        function nextSlide() {
            if (slides.length > 1) {
                slides[currentSlideIndex].classList.remove('active');
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                slides[currentSlideIndex].classList.add('active');
            }
        }
        setInterval(nextSlide, slideTime);

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('map-display').innerText = mapname;
        }
        function DownloadingFile(fileName) { addLog("Downloading " + fileName); }
        function SetStatusChanged(status) { addLog(status); }

        function addLog(text) {
            const container = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerText = text;
            container.prepend(div);
            if (container.children.length > 5) container.removeChild(container.lastChild);
        }

        if (!navigator.userAgent.includes("Valve Source Client")) {
            document.getElementById('map-display').innerText = "gm_construct";
            let i = 0;
            setInterval(() => {
                addLog("Загрузка файла: " + (i++));
            }, 800);
        }
    </script>
</body>
</html>
