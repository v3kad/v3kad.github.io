<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        #slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #000;
        }

        #slideshow .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #slideshow .slide.active {
            opacity: 1;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        #header {
            position: fixed;
            top: 30%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            z-index: 2;
            text-align: center;
            color: #fff;
            padding: 0 20px;
            pointer-events: none;
        }

        #server-name {
            font-size: 52px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        #map-name {
            font-size: 30px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            margin-top: 10px;
            line-height: 1.2;
        }

        #status {
            position: fixed;
            top: 30%;
            left: 0;
            right: 0;
            margin-top: 80px;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            font-size: 16px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            padding: 0 20px;
            pointer-events: none;
        }

        #history {
            position: fixed;
            top: 30%;
            left: 0;
            right: 0;
            margin-top: 110px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 0 20px;
            pointer-events: none;
        }

        #history .log {
            font-size: 15px;
            color: #ffffff;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            transition: opacity 0.4s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 800px;
        }
    </style>
</head>
<body>

    <div id="slideshow"></div>
    <div id="overlay"></div>

    <div id="header">
        <div id="server-name">HOMILAND</div>
        <div id="map-name">gm_huy</div>
    </div>

    <div id="status">Подключение...</div>
    <div id="history"></div>

    <script>
        var SLIDE_DURATION = 7000;
        var MAX_HISTORY_ITEMS = 10;

        var slideshowContainer = document.getElementById('slideshow');
        var currentSlideIndex = 0;
        var slides = [];

        var serverNameEl = document.getElementById('server-name');
        var mapNameEl = document.getElementById('map-name');
        var statusEl = document.getElementById('status');
        var historyEl = document.getElementById('history');

        var history = [];

        function loadImages() {
            fetch('images.json?v=' + Date.now())
                .then(function (response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(function (images) {
                    initSlideshow(images);
                })
                .catch(function (err) {
                    console.error('Ошибка загрузки images.json:', err);
                });
        }

        function initSlideshow(images) {
            if (!images || images.length === 0) return;

            for (var i = 0; i < images.length; i++) {
                var div = document.createElement('div');
                div.className = 'slide';

                var ext = images[i].split('.').pop().toLowerCase();
                if (ext === 'gif') {
                    var img = document.createElement('img');
                    img.src = images[i];
                    img.style.cssText = 'width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;';
                    div.appendChild(img);
                } else {
                    div.style.backgroundImage = 'url("' + images[i] + '")';
                }

                if (i === 0) {
                    div.classList.add('active');
                }

                slideshowContainer.appendChild(div);
                slides.push(div);
            }

            if (slides.length > 1) {
                setInterval(nextSlide, SLIDE_DURATION);
            }
        }

        function nextSlide() {
            if (slides.length === 0) return;
            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            slides[currentSlideIndex].classList.add('active');
        }

        function addHistory(msg) {
            if (!msg) return;
            history.unshift(msg);
            if (history.length > MAX_HISTORY_ITEMS) {
                history = history.slice(0, MAX_HISTORY_ITEMS);
            }
            renderHistory();
        }

        function renderHistory() {
            historyEl.innerHTML = '';
            for (var i = 0; i < history.length; i++) {
                var div = document.createElement('div');
                div.className = 'log';
                var opacity = 1 - (i / MAX_HISTORY_ITEMS) * 0.95;
                div.style.opacity = Math.max(opacity, 0.05);
                var name = history[i];
                if (name.length > 90) name = '...' + name.slice(-87);
                div.textContent = name;
                historyEl.appendChild(div);
            }
        }

        window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            serverNameEl.textContent = servername || 'Сервер';
            mapNameEl.textContent = mapname || '';
        };

        window.SetFilesTotal = function (total) {};
        window.SetFilesNeeded = function (needed) {};

        window.DownloadingFile = function (fileName) {
            if (fileName.charAt(0) === '"' || fileName.charAt(0) === "'") {
                fileName = fileName.substring(1, fileName.length - 1);
            }
            addHistory(statusEl.textContent);
            statusEl.textContent = 'Downloading ' + fileName;
        };

        window.SetStatusChanged = function (status) {
            addHistory(statusEl.textContent);
            statusEl.textContent = status;
        };

        loadImages();
    </script>
</body>
</html>
