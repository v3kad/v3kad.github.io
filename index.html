<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        #slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #slideshow .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #slideshow .slide.active {
            opacity: 1;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        #content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            color: #fff;
            padding: 20px;
        }

        #server-name {
            font-size: 52px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        #map-name {
            font-size: 30px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            margin-bottom: 35px;
        }

        #downloads {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            max-width: 800px;
            width: 100%;
        }

        #downloads .dl-item {
            font-size: 15px;
            color: #ffffff;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            transition: opacity 0.4s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 800px;
        }
    </style>
</head>
<body>

    <div id="slideshow"></div>
    <div id="overlay"></div>

    <div id="content">
        <div id="server-name">Загрузка...</div>
        <div id="map-name"></div>
        <div id="downloads"></div>
    </div>

    <script>
        var SLIDE_DURATION = 2000;
        var MAX_DOWNLOAD_ITEMS = 10;

        var slideshowContainer = document.getElementById('slideshow');
        var currentSlideIndex = 0;
        var slides = [];

        var serverNameEl = document.getElementById('server-name');
        var mapNameEl = document.getElementById('map-name');
        var downloadsEl = document.getElementById('downloads');

        var downloadedFiles = [];

        function loadImages() {
            fetch('images.json')
                .then(function (response) { return response.json(); })
                .then(function (images) { initSlideshow(images); })
                .catch(function (err) { console.error('Ошибка загрузки images.json:', err); });
        }

        function initSlideshow(images) {
            if (!images || images.length === 0) return;

            for (var i = 0; i < images.length; i++) {
                var div = document.createElement('div');
                div.className = 'slide';

                var ext = images[i].split('.').pop().toLowerCase();
                if (ext === 'gif') {
                    var img = document.createElement('img');
                    img.src = images[i];
                    img.style.cssText = 'width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;';
                    div.appendChild(img);
                } else {
                    div.style.backgroundImage = 'url("' + images[i] + '")';
                }

                if (i === 0) {
                    div.classList.add('active');
                }

                slideshowContainer.appendChild(div);
                slides.push(div);
            }

            if (slides.length > 1) {
                setInterval(nextSlide, SLIDE_DURATION);
            }
        }

        function nextSlide() {
            if (slides.length === 0) return;
            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            slides[currentSlideIndex].classList.add('active');
        }

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            serverNameEl.textContent = servername || 'Сервер';
            mapNameEl.textContent = mapname || '';
        }

        function SetFilesTotal(total) {}
        function SetFilesNeeded(needed) {}
        function SetStatusChanged(status) {}

        function DownloadingFile(fileName) {
            if (fileName.charAt(0) === '"' || fileName.charAt(0) === "'") {
                fileName = fileName.substring(1, fileName.length - 1);
            }
            downloadedFiles.unshift(fileName);
            if (downloadedFiles.length > MAX_DOWNLOAD_ITEMS) {
                downloadedFiles = downloadedFiles.slice(0, MAX_DOWNLOAD_ITEMS);
            }
            renderDownloadList();
        }

        function renderDownloadList() {
            downloadsEl.innerHTML = '';
            for (var i = 0; i < downloadedFiles.length; i++) {
                var div = document.createElement('div');
                div.className = 'dl-item';
                var opacity = 1 - (i / MAX_DOWNLOAD_ITEMS) * 0.95;
                div.style.opacity = Math.max(opacity, 0.05);
                var name = downloadedFiles[i];
                if (name.length > 90) name = '...' + name.slice(-87);
                div.textContent = name;
                downloadsEl.appendChild(div);
            }
        }

        loadImages();

        (function demoMode() {
            if (window.location.protocol === 'file:' || window.location.hostname.indexOf('github.io') !== -1 || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                GameDetails('GOMIGRAD RU 1 Homicide', '', 'gm_school', 32, '', 'sandbox');

                var demoFiles = [
                    'models/player/soldier.mdl',
                    'materials/effects/spark.vmt',
                    'sound/weapons/ak47/ak47_fire.wav',
                    'lua/autorun/server/admin_init.lua',
                    'models/props_c17/oildrum001.mdl',
                    'materials/models/player/ct_urban.vtf',
                    'sound/ambient/wind1.wav',
                    'lua/weapons/weapon_base/shared.lua',
                    'models/vehicles/car001.mdl',
                    'materials/skybox/sky_day02_01.vtf',
                    'sound/npc/zombie/zombie_die1.wav',
                    'lua/entities/npc_base/init.lua',
                    'models/props_junk/cardboard_box001a.mdl',
                    'materials/effects/blood_core.vmt',
                    'sound/ui/buttonclick.wav',
                    'models/weapons/v_pistol.mdl',
                    'materials/vgui/logo.vmt',
                    'sound/music/menu_theme.mp3',
                    'lua/derma/init.lua',
                    'models/props_lab/monitor01a.mdl'
                ];

                var idx = 0;
                setInterval(function () {
                    DownloadingFile(demoFiles[idx % demoFiles.length]);
                    idx++;
                }, 700);
            }
        })();
    </script>
</body>
</html>
