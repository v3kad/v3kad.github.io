<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    <!-- Подключаем шрифт Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- СТИЛИ --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Почти черный фон */
            font-family: 'Roboto', sans-serif;
            color: white;
            user-select: none; 
        }

        /* --- СЛОЙ 1: ФОНОВЫЕ КАРТИНКИ (Слайдшоу) --- */
        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10; /* Самый нижний слой */
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: grayscale(80%) brightness(0.3); /* Делаем картинки тусклыми и чб, чтобы сетка выделялась */
        }

        .bg-slide.active {
            opacity: 1;
        }

        /* --- СЛОЙ 2: ВРАЩАЮЩАЯСЯ СЕТКА --- */
        .grid-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            /* Делаем сетку намного больше экрана, чтобы при повороте не было пустых углов */
            width: 250vw; 
            height: 250vw;
            z-index: -5;
            
            /* Рисуем сетку градиентами */
            background-image: 
                linear-gradient(rgba(255, 30, 30, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 30, 30, 0.4) 1px, transparent 1px);
            
            background-size: 80px 80px; /* Размер клетки */
            
            /* Центрируем и запускаем анимацию */
            transform-origin: center;
            animation: rotateGrid 120s linear infinite; /* 120s - скорость вращения (чем больше, тем медленнее) */
        }

        @keyframes rotateGrid {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* --- СЛОЙ 3: ВИНЬЕТКА (Красный центр -> Черные края) --- */
        .vignette-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Поверх сетки, но под текстом */
            
            /* Радиальный градиент: 
               В центре: прозрачный красный (rgba(200, 0, 0, 0.15))
               По краям: сплошной черный (rgba(0, 0, 0, 1)) 
            */
            background: radial-gradient(circle, rgba(255, 0, 0, 0.1) 10%, rgba(0, 0, 0, 0.9) 85%, #000 100%);
            pointer-events: none;
        }

        /* --- СЛОЙ 4: КОНТЕНТ --- */
        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Текстовые стили */
        .title-main {
            font-size: 6rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-shadow: 0px 0px 20px rgba(255, 0, 0, 0.6); /* Красное свечение */
        }

        .title-sub {
            font-size: 2rem;
            font-weight: 900;
            color: #ff3333;
            margin-top: -5px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0px 0px 10px rgba(255, 0, 0, 0.8);
        }

        .map-name {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0,0,0,1);
        }

        /* Логи */
        .logs-container {
            width: 80%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 150px;
            overflow: hidden;
        }

        .log-item {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            margin-bottom: 5px;
            transition: all 0.5s ease;
            text-shadow: 1px 1px 3px rgba(0,0,0,1);
        }

        /* Анимация строк лога */
        .log-item:nth-child(1) {
            font-size: 1.5rem;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            transform: scale(1.05);
        }
        .log-item:nth-child(2) { font-size: 1.2rem; color: #dddddd; opacity: 0.7; }
        .log-item:nth-child(3) { font-size: 1rem; color: #bbbbbb; opacity: 0.4; }
        .log-item:nth-child(n+4) { opacity: 0; height: 0; }

    </style>
</head>
<body>

    <!-- 1. Фоновые картинки (скрыты за сеткой или затемнены) -->
    <div id="bg-container">
        <!-- Слайды генерируются JS -->
    </div>

    <!-- 2. Вращающаяся сетка -->
    <div class="grid-bg"></div>

    <!-- 3. Виньетка (красный центр, черные края) -->
    <div class="vignette-layer"></div>

    <!-- 4. Текст и контент -->
    <div class="content-wrapper">
        <div class="title-main">Z-TYLE</div>
        <div class="title-sub">Fun & NoRules.</div>
        
        <div class="map-name" id="map-display">Загрузка...</div>

        <div class="logs-container" id="logs"></div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ
        // ==========================================
        
        // Можешь оставить одну картинку или убрать совсем, 
        // так как сейчас главный акцент на сетке.
        const backgroundImages = [
            'https://cdn.discordapp.com/attachments/1434555097446223963/1468977267458707646/142120.jpg?ex=6985fb30&is=6984a9b0&hm=5f15eb839106787aa8ffc49d89cf0a4b6ce0cdd62d7ce5fb23eaf0da7de41c36&'
        ];
        const slideTime = 3000;

        // ==========================================
        // ЛОГИКА
        // ==========================================

        // Слайдшоу
        const bgContainer = document.getElementById('bg-container');
        let currentSlideIndex = 0;

        backgroundImages.forEach((url, index) => {
            const div = document.createElement('div');
            div.className = 'bg-slide';
            div.style.backgroundImage = `url('${url}')`;
            if(index === 0) div.classList.add('active');
            bgContainer.insertBefore(div, bgContainer.firstChild);
        });

        const slides = document.querySelectorAll('.bg-slide');

        function nextSlide() {
            if (slides.length > 1) {
                slides[currentSlideIndex].classList.remove('active');
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                slides[currentSlideIndex].classList.add('active');
            }
        }
        setInterval(nextSlide, slideTime);

        // GMod Hooks
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('map-display').innerText = mapname;
        }

        function DownloadingFile(fileName) {
            addLog("Downloading " + fileName);
        }

        function SetStatusChanged(status) {
            addLog(status);
        }

        function addLog(text) {
            const container = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerText = text;
            container.prepend(div);
            if (container.children.length > 5) {
                container.removeChild(container.lastChild);
            }
        }

        // ТЕСТОВЫЙ РЕЖИМ (Если открыл в браузере)
        if (!navigator.userAgent.includes("Valve Source Client")) {
            console.log("DEMO MODE");
            document.getElementById('map-display').innerText = "gm_construct";
            let demoFiles = ["sound/weapons/shotgun/fire.wav", "models/player/combine_soldier.mdl", "lua/cl_init.lua"];
            let demoIndex = 0;
            setInterval(() => {
                addLog("Downloading " + demoFiles[demoIndex % demoFiles.length]);
                demoIndex++;
            }, 800);
        }
    </script>
</body>
</html>
